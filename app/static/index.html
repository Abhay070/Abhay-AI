<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Abhay-AI</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f6f6f7;
    --text: #1a1a1a;
    --muted: #6b6b70;
    --border: #e3e3e6;
    --accent: #2f6feb;
    --user-bg: #2f6feb;
    --user-text: #ffffff;
    --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --panel: #212126;
      --text: #ececef;
      --muted: #9a9aa2;
      --border: #32323a;
      --accent: #6ea0ff;
      --user-bg: #2f5fbe;
      --user-text: #ffffff;
      --err: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #29a56c; }
  .dot.bad { background: var(--err); }
  .spacer { flex: 1; }
  button.ghost {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 5px 11px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }

  #log { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .wrap { max-width: 740px; margin: 0 auto; }
  .msg { margin-bottom: 20px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 11px 15px; border-radius: 14px; max-width: 86%;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--panel); border-bottom-left-radius: 4px; }
  .msg.error .bubble { background: transparent; border: 1px solid var(--err); color: var(--err); font-size: 13px; }
  .bubble code {
    background: rgba(128,128,128,.18); padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em;
  }
  .bubble pre {
    background: rgba(128,128,128,.14); padding: 11px 13px; border-radius: 9px;
    overflow-x: auto; margin: 9px 0;
  }
  .bubble pre code { background: none; padding: 0; }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h2 { font-weight: 600; font-size: 19px; margin: 0 0 6px; color: var(--text); }
  .cursor::after {
    content: "▋"; animation: blink 1.05s steps(2) infinite; margin-left: 1px; opacity: .65;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer { border-top: 1px solid var(--border); padding: 14px 20px; }
  form { max-width: 740px; margin: 0 auto; display: flex; gap: 9px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; padding: 11px 13px; border-radius: 11px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font: inherit; max-height: 190px; min-height: 44px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.send {
    background: var(--accent); color: #fff; border: none; border-radius: 11px;
    padding: 0 20px; height: 44px; cursor: pointer; font-weight: 600; font-size: 14px;
  }
  button.send:disabled { opacity: .45; cursor: not-allowed; }
  .hint { max-width: 740px; margin: 7px auto 0; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Abhay-AI</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">checking…</span></div>
    <div class="spacer"></div>
    <button class="ghost" id="clear">New chat</button>
  </header>

  <div id="log">
    <div class="wrap" id="messages">
      <div class="empty" id="empty">
        <h2>Your own AI</h2>
        <div>Ask it anything.</div>
      </div>
    </div>
  </div>

  <footer>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Send a message…" autofocus></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </footer>

<script>
// The entire client. Conversation state is one array; we resend it every turn,
// because the model itself remembers nothing between requests.
const messages = [];
const $log = document.getElementById('log');
const $messages = document.getElementById('messages');
const $empty = document.getElementById('empty');
const $form = document.getElementById('form');
const $input = document.getElementById('input');
const $send = document.getElementById('send');

// Minimal markdown: fenced code, inline code, bold, italic. Everything is
// escaped first, so model output can never inject HTML into the page.
function render(text) {
  const esc = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>');
}

function addBubble(role, text = '') {
  $empty.style.display = 'none';
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = render(text);
  msg.appendChild(bubble);
  $messages.appendChild(msg);
  $log.scrollTop = $log.scrollHeight;
  return bubble;
}

async function checkHealth() {
  const $dot = document.getElementById('dot');
  const $status = document.getElementById('status');
  try {
    const r = await fetch('/api/health');
    const h = await r.json();
    $dot.className = 'dot ' + (h.ok ? 'ok' : 'bad');
    $status.textContent = h.ok ? h.detail : h.detail;
    $status.title = h.provider;
  } catch {
    $dot.className = 'dot bad';
    $status.textContent = 'server unreachable';
  }
}

$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 190) + 'px';
});

$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $form.requestSubmit(); }
});

document.getElementById('clear').addEventListener('click', () => {
  messages.length = 0;
  $messages.querySelectorAll('.msg').forEach(n => n.remove());
  $empty.style.display = '';
  $input.focus();
});

$form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $input.value.trim();
  if (!text || $send.disabled) return;

  addBubble('user', text);
  messages.push({ role: 'user', content: text });
  $input.value = '';
  $input.style.height = 'auto';
  $send.disabled = true;

  const bubble = addBubble('assistant', '');
  bubble.classList.add('cursor');
  let reply = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    // Read the SSE stream by hand -- it is only a few lines, and it makes the
    // "typing" effect exactly as responsive as the model itself.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const body = line.slice(6);
        if (body === '[DONE]') continue;
        const data = JSON.parse(body);
        if (data.error) {
          bubble.parentElement.className = 'msg error';
          bubble.classList.remove('cursor');
          bubble.textContent = data.error;
          $send.disabled = false;
          return;
        }
        reply += data.delta;
        bubble.innerHTML = render(reply);
        $log.scrollTop = $log.scrollHeight;
      }
    }

    messages.push({ role: 'assistant', content: reply });
  } catch (err) {
    bubble.parentElement.className = 'msg error';
    bubble.textContent = String(err);
  } finally {
    bubble.classList.remove('cursor');
    $send.disabled = false;
    $input.focus();
  }
});

checkHealth();
</script>
</body>
</html>
